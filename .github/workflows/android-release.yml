name: Android Release

on:
  push:
    tags:
      - "v*.*.*"        # e.g. v2026.5.19 — always builds thirdParty release
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor"
        required: true
        default: thirdParty
        type: choice
        options:
          - thirdParty
          - play
      build_type:
        description: "Build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

# ─────────────────────────────────────────────────────────────────────────────
# Required secrets (Settings → Secrets and variables → Actions):
#
#   NOVA_AI_KEYSTORE_BASE64   Base64-encoded .jks file. Generate with:
#                               keytool -genkeypair -v \
#                                 -keystore nova-ai.jks -keyalg RSA \
#                                 -keysize 2048 -validity 10000 \
#                                 -alias nova-ai-key
#                               base64 -w0 nova-ai.jks | pbcopy
#   NOVA_AI_KEYSTORE_PASSWORD Keystore password
#   NOVA_AI_KEY_ALIAS         Key alias (e.g. nova-ai-key)
#   NOVA_AI_KEY_PASSWORD      Key password
#
# Debug builds don't need any secrets.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build Nova AI APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # required to attach APK to GitHub Releases

    steps:
      # ── 1. Resolve flavor + build type ──────────────────────────────────────
      # Do this first so every subsequent step can use the outputs.
      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ inputs.flavor }}"
            BUILD_TYPE="${{ inputs.build_type }}"
          else
            FLAVOR="thirdParty"
            BUILD_TYPE="release"
          fi

          # Capitalise first letter for Gradle task (thirdParty → ThirdParty)
          FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          BUILD_TYPE_CAP="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"

          echo "flavor=${FLAVOR}"                               >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}"                       >> "$GITHUB_OUTPUT"
          echo "gradle_task=:app:assemble${FLAVOR_CAP}${BUILD_TYPE_CAP}" >> "$GITHUB_OUTPUT"
          echo "is_release=$( [ "$BUILD_TYPE" = "release" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      # ── 2. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.android-sdk
          key: ${{ runner.os }}-android-sdk-v1-cmdline-12266719-platform-36-build-tools-36.0.0
          restore-keys: |
            ${{ runner.os }}-android-sdk-v1-

      - name: Set up Android SDK cmdline-tools
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="$HOME/.android-sdk"
          CMDLINE_TOOLS_VERSION="12266719"
          ARCHIVE="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          URL="https://dl.google.com/android/repository/${ARCHIVE}"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q "/tmp/${ARCHIVE}" -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"     >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools"           >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools"       \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ── 5. Keystore (release only) ───────────────────────────────────────────
      - name: Decode keystore
        if: steps.params.outputs.is_release == 'true'
        run: |
          echo "${{ secrets.NOVA_AI_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/nova-ai.jks"

      # ── 6. Build ─────────────────────────────────────────────────────────────
      # Signing properties are passed as -P flags directly to Gradle.
      # This avoids any gradle.properties indentation / timing issues.
      - name: Build APK (release — signed)
        if: steps.params.outputs.is_release == 'true'
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache \
            -PNOVA_AI_ANDROID_STORE_FILE="${RUNNER_TEMP}/nova-ai.jks" \
            -PNOVA_AI_ANDROID_STORE_PASSWORD="${{ secrets.NOVA_AI_KEYSTORE_PASSWORD }}" \
            -PNOVA_AI_ANDROID_KEY_ALIAS="${{ secrets.NOVA_AI_KEY_ALIAS }}" \
            -PNOVA_AI_ANDROID_KEY_PASSWORD="${{ secrets.NOVA_AI_KEY_PASSWORD }}" \
            "${{ steps.params.outputs.gradle_task }}"

      - name: Build APK (debug — unsigned)
        if: steps.params.outputs.is_release == 'false'
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache \
            "${{ steps.params.outputs.gradle_task }}"

      # ── 7. Collect APK ───────────────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH=$(find apps/android/app/build/outputs/apk \
            -name "nova-ai-*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found. Listing build outputs for diagnosis:" >&2
            find apps/android/app/build/outputs -type f | sort >&2
            exit 1
          fi

          echo "path=${APK_PATH}"              >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${APK_PATH}")" >> "$GITHUB_OUTPUT"
          echo "Found APK: ${APK_PATH}"

      # ── 8. Upload artifact (every run) ───────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── 9. Attach to GitHub Release (tag pushes only) ────────────────────────
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
